<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Private Portal</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: rgba(22, 22, 28, 0.75);
      --surface-border: rgba(255, 255, 255, 0.1);
      --accent: #d4af37;
      --text: #f4f4f5;
    }
    
    /* SPLASH SCREEN STYLING */
    #splash-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease-in-out;
    }
    .splash-logo {
      font-family: "Georgia", serif;
      font-size: 1.5rem;
      color: var(--accent);
      letter-spacing: 4px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* Sisipkan style portal lo yang sebelumnya di bawah sini */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    .container { width: 100%; max-width: 390px; margin: 0 auto; padding: 24px 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    /* ... (tambahin semua CSS class portal lo yang sebelumnya dari response gue yang tadi) ... */
  </style>
</head>
<body>

  <!-- LOADING ELEMENT -->
  <div id="splash-screen">
    <div class="splash-logo">GENI</div>
  </div>

  <div class="container">
    <!-- Isi Portal lo yang tadi (Navigation, Tabs, Cards, etc) -->
    <!-- ... -->
  </div>

  <script>
    // JS SPLASH SCREEN LOGIC
    window.addEventListener('load', () => {
      const splash = document.getElementById('splash-screen');
      setTimeout(() => {
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 800);
      }, 1200); // 1.2 detik delay biar kelihatan smooth
    });

    // ... (sisipkan semua JS logic portal lo dari response sebelumnya) ...
  </script>
</body>
</html>
