<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>August 24 — Geni</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: rgba(22, 22, 26, 0.95);
      --surface-border: rgba(255, 255, 255, 0.08);
      --accent: #d4af37;
      --accent-muted: rgba(212, 175, 55, 0.12);
      --text: #f4f4f5;
      --text-dim: #a1a1aa;
      --glow: rgba(212, 175, 55, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.06) 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--surface-border);
      border-radius: 28px;
      padding: 28px 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .greeting {
      font-family: "Georgia", "Didot", serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 4px;
      font-style: italic;
    }

    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      opacity: 0.9;
    }

    .steps-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--surface-border);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dot.active {
      background: var(--accent);
      transform: scale(1.4);
      box-shadow: 0 0 10px var(--glow);
    }

    .stage-label {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: -0.3px;
      margin-bottom: 18px;
      text-align: center;
      color: var(--text);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .opt-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 400;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .opt-card:hover {
      background: var(--accent-muted);
      border-color: rgba(212, 175, 55, 0.3);
    }

    .custom-input-box {
      display: none;
      margin-bottom: 16px;
    }

    .text-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--accent);
      border-radius: 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 10px;
    }

    .actions-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px dashed rgba(212, 175, 55, 0.4);
      background: transparent;
      color: var(--accent);
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .wheel-modal {
      display: none;
    }

    .wheel-container {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 16px;
    }

    .needle {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 16px solid var(--accent);
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid var(--surface-border);
    }

    .selection-display {
      min-height: 36px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--accent);
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--surface-border);
      background: linear-gradient(180deg, #f4f4f5 0%, #e4e4e7 100%);
      color: #09090b;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .summary-card {
      background: rgba(10, 10, 12, 0.6);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.85rem;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-key {
      color: var(--text-dim);
    }

    .summary-val {
      color: var(--accent);
      font-weight: 500;
      text-align: right;
      max-width: 60%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="greeting">Hi, Geni</div>
      <div class="subtitle">August 24, 2026</div>
    </div>

    <div class="steps-bar">
      <div class="dot active" id="dot-0"></div>
      <div class="dot" id="dot-1"></div>
      <div class="dot" id="dot-2"></div>
      <div class="dot" id="dot-3"></div>
    </div>

    <div id="selection-view">
      <div class="stage-label" id="stage-title">Choose Main Dining</div>
      
      <div class="options-grid" id="options-container"></div>

      <div class="custom-input-box" id="custom-box">
        <input type="text" class="text-input" id="custom-input" placeholder="Type your idea here...">
        <button class="btn-primary" onclick="submitCustomInput()" style="padding:12px;">Save Option</button>
      </div>

      <div class="actions-bar" id="actions-bar">
        <button class="btn-secondary" onclick="showCustomInput()">Suggest others ✏️</button>
        <button class="btn-secondary" onclick="enableWheelMode()">Can’t pick? Spin for me 🎲</button>
      </div>
    </div>

    <div id="wheel-view" class="wheel-modal">
      <div class="stage-label" id="wheel-stage-title">Spinning Selection</div>
      <div class="wheel-container">
        <div class="needle"></div>
        <canvas id="wheel" width="480" height="480"></canvas>
      </div>
      <div class="selection-display" id="result-display">Tap Spin to Decide</div>
      <button class="btn-primary" id="spin-btn" onclick="spinWheel()">Spin Wheel</button>
    </div>

    <div id="summary-view" style="display: none;">
      <div class="stage-label">All Set 🥂</div>
      <div class="summary-card">
        <div class="summary-row"><span class="summary-key">1. Dining</span><span class="summary-val" id="sum-food">-</span></div>
        <div class="summary-row"><span class="summary-key">2. Activity</span><span class="summary-val" id="sum-act">-</span></div>
        <div class="summary-row"><span class="summary-key">3. Dirty Coffee</span><span class="summary-val" id="sum-coffee">-</span></div>
        <div class="summary-row"><span class="summary-key">4. Dessert</span><span class="summary-val" id="sum-dessert">-</span></div>
      </div>
      <button class="btn-primary" onclick="sendToWhatsApp()">Confirm & Send Plan</button>
    </div>
  </div>

  <script>
    const MAIN_PHONE_NUMBER = "6281298811308";
    const SECONDARY_PHONE_NUMBER = "6282284126820";

    const stages = [
      {
        key: 'food',
        title: 'First: Choose Main Dining 🥩',
        options: [
          'Hwaro Grill (AYCE)', 
          'Kintan Buffet (AYCE)', 
          'Gyu-Kaku (AYCE)', 
          'Beef Boss (AYCE)', 
          'Bounchon Steakhouse',
          'Justus Steakhouse',
          'Meatguy Steakhouse',
          'Holycow! Steakhouse',
          'Bistecca'
        ]
      },
      {
        key: 'activity',
        title: 'Next: Late Afternoon Activity 🌆',
        options: [
          'Go-Kart Racing',
          'Explore New Cafe & Eats',
          'Indoor Bouldering Session', 
          'Late Pottery / Craft Workshop', 
          'Gallery Walk & Sunset Stroll'
        ]
      },
      {
        key: 'coffee',
        title: 'Then: Choose Dirty Coffee Spot ☕',
        options: [
          'Second Floor Coffee', 
          'Bakerman (ASHTA)', 
          'Common Grounds', 
          'Titik Temu Coffee'
        ]
      },
      {
        key: 'dessert',
        title: 'Finally: Choose Dessert 🥐',
        options: [
          'Flour', 
          'Gontran Cherrier', 
          'Union Brasserie', 
          'Don Bakeshop',
          'Paris Baguette'
        ]
      }
    ];

    let currentStage = 0;
    const selections = {};
    let isSpinning = false;
    let currentAngle = 0;

    const palette = ['#1a1a1e', '#24242a', '#141417', '#2c2c34', '#1f1f24', '#282830'];

    function renderStage() {
      document.querySelectorAll('.dot').forEach((d, idx) => {
        d.classList.toggle('active', idx === currentStage);
      });

      const stage = stages[currentStage];
      document.getElementById('stage-title').innerText = stage.title;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      stage.options.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'opt-card';
        card.innerHTML = `<span>${opt}</span> <span style="opacity:0.4;">→</span>`;
        card.onclick = () => selectOption(opt);
        container.appendChild(card);
      });

      document.getElementById('custom-box').style.display = 'none';
      document.getElementById('custom-input').value = '';
      document.getElementById('actions-bar').style.display = 'flex';

      document.getElementById('selection-view').style.display = 'block';
      document.getElementById('wheel-view').style.display = 'none';
    }

    function selectOption(value) {
      selections[stages[currentStage].key] = value;
      speakText(`Selected ${value}`);
      nextStage();
    }

    function showCustomInput() {
      document.getElementById('custom-box').style.display = 'block';
      document.getElementById('custom-input').focus();
    }

    function submitCustomInput() {
      const val = document.getElementById('custom-input').value.trim();
      if (val) {
        selectOption(val);
      }
    }

    function enableWheelMode() {
      document.getElementById('selection-view').style.display = 'none';
      document.getElementById('wheel-view').style.display = 'block';
      document.getElementById('wheel-stage-title').innerText = stages[currentStage].title;
      document.getElementById('result-display').innerText = "Tap Spin to Decide";
      document.getElementById('spin-btn').disabled = false;
      currentAngle = 0;
      drawWheel();
    }

    function drawWheel() {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const opts = stages[currentStage].options;
      const slice = (2 * Math.PI) / opts.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < opts.length; i++) {
        const angle = currentAngle + i * slice;
        ctx.beginPath();
        ctx.fillStyle = palette[i % palette.length];
        ctx.moveTo(240, 240);
        ctx.arc(240, 240, 230, angle, angle + slice);
        ctx.lineTo(240, 240);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.save();
        ctx.translate(240, 240);
        ctx.rotate(angle + slice / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#d4af37";
        ctx.font = "500 13px -apple-system, sans-serif";
        ctx.fillText(opts[i], 210, 4);
        ctx.restore();
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById('spin-btn').disabled = true;

      const extraRounds = 5 + Math.floor(Math.random() * 3);
      const randomOffset = Math.random() * (2 * Math.PI);
      const totalRotation = extraRounds * 2 * Math.PI + randomOffset;
      
      const startAngle = currentAngle;
      const startTime = performance.now();
      const duration = 3800;

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 4);

        currentAngle = startAngle + totalRotation * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          finalizeSpin();
        }
      }
      requestAnimationFrame(animate);
    }

    function finalizeSpin() {
      const opts = stages[currentStage].options;
      const slice = (2 * Math.PI) / opts.length;
      
      const normalizedAngle = (1.5 * Math.PI - (currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const selectedIndex = Math.floor(normalizedAngle / slice) % opts.length;
      const chosenOption = opts[selectedIndex];

      selections[stages[currentStage].key] = chosenOption;
      document.getElementById('result-display').innerText = chosenOption;

      speakText(`Selected ${chosenOption}`);

      setTimeout(() => {
        nextStage();
      }, 1800);
    }

    function nextStage() {
      currentStage++;
      if (currentStage < stages.length) {
        renderStage();
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.getElementById('selection-view').style.display = 'none';
      document.getElementById('wheel-view').style.display = 'none';
      document.getElementById('summary-view').style.display = 'block';

      document.getElementById('sum-food').innerText = selections.food;
      document.getElementById('sum-act').innerText = selections.activity;
      document.getElementById('sum-coffee').innerText = selections.coffee;
      document.getElementById('sum-dessert').innerText = selections.dessert;

      speakText("Plan complete for August 24th.");
    }

    function sendToWhatsApp() {
      const msg = `Hi! Here's our plan for August 24th:%0A%0A🥩 *Dining:* ${selections.food}%0A✨ *Afternoon Activity:* ${selections.activity}%0A☕ *Dirty Coffee:* ${selections.coffee}%0A🥐 *Dessert:* ${selections.dessert}%0A%0A(Cc: ${SECONDARY_PHONE_NUMBER})`;
      window.open(`https://wa.me/${MAIN_PHONE_NUMBER}?text=${msg}`, '_blank');
    }

    renderStage();
  </script>
</body>
</html>
