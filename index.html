<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>August 24 — Geni</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --surface: rgba(22, 22, 26, 0.95);
      --surface-border: rgba(255, 255, 255, 0.08);
      --accent: #d4af37;
      --accent-muted: rgba(212, 175, 55, 0.12);
      --text: #f4f4f5;
      --text-dim: #a1a1aa;
      --glow: rgba(212, 175, 55, 0.25);
      --mouse-x: 50%;
      --mouse-y: 50%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(212, 175, 55, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.06) 0%, transparent 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
      touch-action: pan-y;
      transition: background-image 0.1s ease;
    }

    .container {
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--surface-border);
      border-radius: 28px;
      padding: 32px 22px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }

    .subtitle-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    .audio-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--surface-border);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.3s ease;
    }

    .audio-pill.playing {
      background: var(--accent-muted);
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--glow);
    }

    .greeting {
      font-family: "Georgia", "Didot", serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 2px;
      font-style: italic;
    }

    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      opacity: 0.9;
    }

    .note-text {
      font-size: 0.92rem;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.5;
      margin: 20px 0 28px;
      font-style: italic;
    }

    .steps-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--surface-border);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .dot.active {
      background: var(--accent);
      transform: scale(1.4);
      box-shadow: 0 0 10px var(--glow);
    }

    .stage-label {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: -0.3px;
      margin-bottom: 18px;
      text-align: center;
      color: var(--text);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .opt-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 400;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .opt-card.selected {
      background: var(--accent-muted);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--glow);
    }

    .opt-card:active {
      transform: scale(0.98);
    }

    .custom-input-box {
      display: none;
      margin-bottom: 16px;
    }

    .text-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--accent);
      border-radius: 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 10px;
    }

    .actions-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px dashed rgba(212, 175, 55, 0.4);
      background: transparent;
      color: var(--accent);
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .wheel-modal {
      display: none;
    }

    .wheel-container {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 16px;
    }

    .needle {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 16px solid var(--accent);
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid var(--surface-border);
    }

    .selection-display {
      min-height: 36px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--accent);
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--surface-border);
      background: linear-gradient(180deg, #f4f4f5 0%, #e4e4e7 100%);
      color: #09090b;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Digital Pass Styling */
    .digital-pass {
      background: linear-gradient(145deg, rgba(18, 18, 22, 0.9), rgba(10, 10, 12, 0.95));
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 20px;
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .pass-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .pass-title {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    .pass-guest {
      font-family: "Georgia", serif;
      font-size: 1.1rem;
      font-style: italic;
      color: var(--text);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.85rem;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-key {
      color: var(--text-dim);
    }

    .summary-val {
      color: var(--accent);
      font-weight: 500;
      text-align: right;
      max-width: 60%;
    }

    .pass-footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .barcode-stub {
      height: 24px;
      background: repeating-linear-gradient(
        90deg,
        var(--accent-muted),
        var(--accent-muted) 2px,
        transparent 2px,
        transparent 6px
      );
      opacity: 0.6;
      border-radius: 4px;
    }

    .swipe-hint {
      font-size: 0.72rem;
      color: var(--text-dim);
      text-align: center;
      margin-top: 14px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="container" id="main-container">
    
    <!-- Welcome View -->
    <div id="welcome-view">
      <div class="header">
        <div class="greeting" id="dynamic-greeting">Hi, Geni</div>
        <div class="subtitle-wrapper">
          <span class="subtitle">August 24, 2026</span>
          <button class="audio-pill" id="audio-toggle" onclick="toggleAudio()" title="Toggle Ambient Audio">
            <span id="audio-icon">🎵</span>
          </button>
        </div>
      </div>
      <div class="note-text">
        No special occasion. Just thought you should be celebrated everyday.
      </div>
      <button class="btn-primary" onclick="startFlow()">Start Planning ✨</button>
    </div>

    <!-- Main Content Container -->
    <div id="app-flow" style="display: none;">
      <div class="header">
        <div class="greeting">Hi, Geni</div>
        <div class="subtitle-wrapper">
          <span class="subtitle">August 24, 2026</span>
        </div>
      </div>

      <div class="steps-bar">
        <div class="dot active" id="dot-0" onclick="goToStage(0)"></div>
        <div class="dot" id="dot-1" onclick="goToStage(1)"></div>
        <div class="dot" id="dot-2" onclick="goToStage(2)"></div>
        <div class="dot" id="dot-3" onclick="goToStage(3)"></div>
      </div>

      <div id="selection-view">
        <div class="stage-label" id="stage-title">Choose Main Dining</div>
        
        <div class="options-grid" id="options-container"></div>

        <div class="custom-input-box" id="custom-box">
          <input type="text" class="text-input" id="custom-input" placeholder="Type your idea here...">
          <button class="btn-primary" onclick="submitCustomInput()" style="padding:12px;">Save Option</button>
        </div>

        <div class="actions-bar" id="actions-bar">
          <button class="btn-secondary" onclick="showCustomInput()">Suggest others ✏️</button>
          <button class="btn-secondary" onclick="enableWheelMode()">Can’t pick? Spin for me 🎲</button>
        </div>

        <div class="swipe-hint">← Swipe left / right to navigate →</div>
      </div>

      <div id="wheel-view" class="wheel-modal">
        <div class="stage-label" id="wheel-stage-title">Spinning Selection</div>
        <div class="wheel-container">
          <div class="needle"></div>
          <canvas id="wheel" width="480" height="480"></canvas>
        </div>
        <div class="selection-display" id="result-display">Tap Spin to Decide</div>
        <button class="btn-primary" id="spin-btn" onclick="spinWheel()">Spin Wheel</button>
      </div>

      <div id="summary-view" style="display: none;">
        <div class="stage-label">Access Granted 🥂</div>
        
        <div class="digital-pass">
          <div class="pass-header">
            <span class="pass-title">AUG 24 PASS</span>
            <span class="pass-guest">Geni</span>
          </div>
          <div class="summary-row"><span class="summary-key">1. Dining</span><span class="summary-val" id="sum-food">-</span></div>
          <div class="summary-row"><span class="summary-key">2. Activity</span><span class="summary-val" id="sum-act">-</span></div>
          <div class="summary-row"><span class="summary-key">3. Dirty Coffee</span><span class="summary-val" id="sum-coffee">-</span></div>
          <div class="summary-row"><span class="summary-key">4. Dessert</span><span class="summary-val" id="sum-dessert">-</span></div>
          <div class="pass-footer">
            <div class="barcode-stub"></div>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px;">
          <button class="btn-primary" onclick="sendToWhatsApp()">Confirm & Send Plan</button>
          <button class="btn-secondary" onclick="addToCalendar()">Add to Calendar 📅</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const MAIN_PHONE_NUMBER = "6281298811308";

    // Web Audio Synthesizer (Native Ambient Piano Chords)
    let audioCtx = null;
    let isPlayingAudio = false;
    let synthTimer = null;

    const chords = [
      [293.66, 370.00, 440.00, 554.37], // Dmaj7
      [246.94, 293.66, 370.00, 440.00], // Bm7
      [164.81, 246.94, 293.66, 392.00], // Em7
      [220.00, 277.18, 329.63, 392.00]  // A7
    ];
    let chordIdx = 0;

    function playSoftChord() {
      if (!isPlayingAudio || !audioCtx) return;
      
      const currentChord = chords[chordIdx % chords.length];
      chordIdx++;

      currentChord.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.03, audioCtx.currentTime + 0.8);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 4.0);
      });
    }

    function toggleAudio() {
      triggerHaptic();
      const audioBtn = document.getElementById('audio-toggle');
      const audioIcon = document.getElementById('audio-icon');

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (isPlayingAudio) {
        isPlayingAudio = false;
        clearInterval(synthTimer);
        audioBtn.classList.remove('playing');
        audioIcon.innerText = '🎵';
      } else {
        isPlayingAudio = true;
        audioBtn.classList.add('playing');
        audioIcon.innerText = '🔊';
        playSoftChord();
        synthTimer = setInterval(playSoftChord, 3500);
      }
    }

    // Set Dynamic Greeting
    function initGreeting() {
      const hour = new Date().getHours();
      let greetingText = "Hi, Geni";
      if (hour >= 5 && hour < 12) {
        greetingText = "Good morning, Geni";
      } else if (hour >= 12 && hour < 18) {
        greetingText = "Good afternoon, Geni";
      } else {
        greetingText = "Good evening, Geni";
      }
      document.getElementById('dynamic-greeting').innerText = greetingText;
    }
    initGreeting();

    // Mouse / Touch Glow Tracking
    window.addEventListener('touchmove', e => {
      if (e.touches.length > 0) {
        const x = (e.touches[0].clientX / window.innerWidth) * 100;
        const y = (e.touches[0].clientY / window.innerHeight) * 100;
        document.documentElement.style.setProperty('--mouse-x', `${x}%`);
        document.documentElement.style.setProperty('--mouse-y', `${y}%`);
      }
    });

    window.addEventListener('mousemove', e => {
      const x = (e.clientX / window.innerWidth) * 100;
      const y = (e.clientY / window.innerHeight) * 100;
      document.documentElement.style.setProperty('--mouse-x', `${x}%`);
      document.documentElement.style.setProperty('--mouse-y', `${y}%`);
    });

    const stages = [
      {
        key: 'food',
        title: 'First: Choose Main Dining 🥩',
        options: [
          'Hwaro Grill (AYCE)', 
          'Kintan Buffet (AYCE)', 
          'Gyu-Kaku (AYCE)', 
          'Beef Boss (AYCE)', 
          'Bounchon Steakhouse',
          'Justus Steakhouse',
          'Meatguy Steakhouse',
          'Bistecca'
        ]
      },
      {
        key: 'activity',
        title: 'Next: Late Afternoon Activity 🌆',
        options: [
          'Go-Kart Racing',
          'Explore New Cafe & Eats',
          'Indoor Bouldering Session', 
          'Late Pottery / Craft Workshop', 
          'Gallery Walk & Sunset Stroll'
        ]
      },
      {
        key: 'coffee',
        title: 'Then: Choose Dirty Coffee Spot ☕',
        options: [
          'Second Floor Coffee', 
          'Bakerman (ASHTA)', 
          'Common Grounds', 
          'Titik Temu Coffee'
        ]
      },
      {
        key: 'dessert',
        title: 'Finally: Choose Dessert 🥐',
        options: [
          'Flour', 
          'Gontran Cherrier', 
          'Union Brasserie', 
          'Don Bakeshop',
          'Paris Baguette'
        ]
      }
    ];

    let currentStage = 0;
    const selections = {};
    let isSpinning = false;
    let currentAngle = 0;

    const palette = ['#1a1a1e', '#24242a', '#141417', '#2c2c34', '#1f1f24', '#282830'];

    function triggerHaptic() {
      if (navigator.vibrate) {
        navigator.vibrate(15);
      }
    }

    function startFlow() {
      triggerHaptic();
      document.getElementById('welcome-view').style.display = 'none';
      document.getElementById('app-flow').style.display = 'block';
      renderStage();
    }

    function goToStage(idx) {
      if (idx >= 0 && idx < stages.length) {
        triggerHaptic();
        currentStage = idx;
        renderStage();
      }
    }

    function renderStage() {
      document.querySelectorAll('.dot').forEach((d, idx) => {
        d.classList.toggle('active', idx === currentStage);
      });

      const stage = stages[currentStage];
      document.getElementById('stage-title').innerText = stage.title;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const currentSelection = selections[stage.key];

      stage.options.forEach(opt => {
        const card = document.createElement('div');
        const isSelected = currentSelection === opt;
        card.className = `opt-card ${isSelected ? 'selected' : ''}`;
        card.innerHTML = `<span>${opt}</span> <span style="opacity:${isSelected ? '1' : '0.4'};">${isSelected ? '✓' : '→'}</span>`;
        card.onclick = () => {
          triggerHaptic();
          selectOption(opt);
        };
        container.appendChild(card);
      });

      document.getElementById('custom-box').style.display = 'none';
      document.getElementById('custom-input').value = '';
      document.getElementById('actions-bar').style.display = 'flex';

      document.getElementById('selection-view').style.display = 'block';
      document.getElementById('wheel-view').style.display = 'none';
      document.getElementById('summary-view').style.display = 'none';
    }

    function selectOption(value) {
      selections[stages[currentStage].key] = value;
      nextStage();
    }

    function showCustomInput() {
      triggerHaptic();
      document.getElementById('custom-box').style.display = 'block';
      document.getElementById('custom-input').focus();
    }

    function submitCustomInput() {
      const val = document.getElementById('custom-input').value.trim();
      if (val) {
        triggerHaptic();
        selectOption(val);
      }
    }

    function enableWheelMode() {
      triggerHaptic();
      document.getElementById('selection-view').style.display = 'none';
      document.getElementById('wheel-view').style.display = 'block';
      document.getElementById('wheel-stage-title').innerText = stages[currentStage].title;
      document.getElementById('result-display').innerText = "Tap Spin to Decide";
      document.getElementById('spin-btn').disabled = false;
      currentAngle = 0;
      drawWheel();
    }

    function drawWheel() {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const opts = stages[currentStage].options;
      const slice = (2 * Math.PI) / opts.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < opts.length; i++) {
        const angle = currentAngle + i * slice;
        ctx.beginPath();
        ctx.fillStyle = palette[i % palette.length];
        ctx.moveTo(240, 240);
        ctx.arc(240, 240, 230, angle, angle + slice);
        ctx.lineTo(240, 240);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.save();
        ctx.translate(240, 240);
        ctx.rotate(angle + slice / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#d4af37";
        ctx.font = "500 13px -apple-system, sans-serif";
        ctx.fillText(opts[i], 210, 4);
        ctx.restore();
      }
    }

    function spinWheel() {
      if (isSpinning) return;
      triggerHaptic();
      isSpinning = true;
      document.getElementById('spin-btn').disabled = true;

      const extraRounds = 5 + Math.floor(Math.random() * 3);
      const randomOffset = Math.random() * (2 * Math.PI);
      const totalRotation = extraRounds * 2 * Math.PI + randomOffset;
      
      const startAngle = currentAngle;
      const startTime = performance.now();
      const duration = 3800;

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 4);

        currentAngle = startAngle + totalRotation * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          finalizeSpin();
        }
      }
      requestAnimationFrame(animate);
    }

    function finalizeSpin() {
      triggerHaptic();
      const opts = stages[currentStage].options;
      const slice = (2 * Math.PI) / opts.length;
      
      const normalizedAngle = (1.5 * Math.PI - (currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const selectedIndex = Math.floor(normalizedAngle / slice) % opts.length;
      const chosenOption = opts[selectedIndex];

      selections[stages[currentStage].key] = chosenOption;
      document.getElementById('result-display').innerText = chosenOption;

      setTimeout(() => {
        nextStage();
      }, 1800);
    }

    function nextStage() {
      currentStage++;
      if (currentStage < stages.length) {
        renderStage();
      } else {
        showSummary();
      }
    }

    function prevStage() {
      if (currentStage > 0) {
        triggerHaptic();
        currentStage--;
        renderStage();
      }
    }

    function showSummary() {
      document.getElementById('selection-view').style.display = 'none';
      document.getElementById('wheel-view').style.display = 'none';
      document.getElementById('summary-view').style.display = 'block';

      document.getElementById('sum-food').innerText = selections.food || '-';
      document.getElementById('sum-act').innerText = selections.activity || '-';
      document.getElementById('sum-coffee').innerText = selections.coffee || '-';
      document.getElementById('sum-dessert').innerText = selections.dessert || '-';

      if (window.confetti) {
        confetti({
          particleCount: 70,
          spread: 60,
          origin: { y: 0.6 },
          colors: ['#d4af37', '#ffffff', '#2c2c34']
        });
      }
    }

    function sendToWhatsApp() {
      triggerHaptic();
      const msg = `Hi! Here's our plan for August 24th:%0A%0A🥩 *Dining:* ${selections.food}%0A✨ *Afternoon Activity:* ${selections.activity}%0A☕ *Dirty Coffee:* ${selections.coffee}%0A🥐 *Dessert:* ${selections.dessert}`;
      window.open(`https://wa.me/${MAIN_PHONE_NUMBER}?text=${msg}`, '_blank');
    }

    function addToCalendar() {
      triggerHaptic();
      const icsData = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//August 24 Geni Date Pass//EN
BEGIN:VEVENT
SUMMARY:August 24 — Special Date
DESCRIPTION:Dining: ${selections.food}\\nActivity: ${selections.activity}\\nDirty Coffee: ${selections.coffee}\\nDessert: ${selections.dessert}
DTSTART:20260824T060000Z
DTEND:20260824T140000Z
LOCATION:Jakarta
END:VEVENT
END:VCALENDAR`;

      const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', 'August_24_Plan.ics');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Touch Swipe Gesture Handling
    let touchStartX = 0;
    let touchEndX = 0;

    const mainContainer = document.getElementById('main-container');

    mainContainer.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    mainContainer.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 50) {
        if (diff < 0) {
          if (selections[stages[currentStage].key]) {
            nextStage();
          }
        } else {
          prevStage();
        }
      }
    }
  </script>
</body>
